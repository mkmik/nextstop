[package]
name = "reworkspace"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "A NeXTSTEP-style workspace, natively rendered"
authors = ["ReWorkspace contributors"]

[dependencies]
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
resvg = { version = "0.48", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
trash = "5"
alacritty_terminal = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2", features = ["NSScreen", "NSApplication", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSGeometry", "NSThread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
