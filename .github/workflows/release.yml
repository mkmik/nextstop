name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: scripts/bundle-macos.sh
      - run: cd dist && zip -ry NeXTSTOP-macos-arm64.app.zip NeXTSTOP.app
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.app.zip
          body: "Unsigned builds. macOS: run `xattr -cr /Applications/NeXTSTOP.app` after copying it out of the DMG (see README)."
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - run: copy target\${{ matrix.target }}\release\nextstop.exe NeXTSTOP-portable-${{ matrix.arch }}.exe
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: NeXTSTOP-portable-${{ matrix.arch }}.exe
